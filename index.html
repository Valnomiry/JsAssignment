<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- <link rel="icon" href="./image/bookmark.png"> -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"> -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <!-- <link rel="stylesheet" href="./media.css"> -->


    <title>Document</title>
</head>

<body>




    <!-- header background -->


    <main class=" main">


        <nav class="navbar navbar-expand-lg home d-none">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-dark navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link btn btn-outline-warning" aria-current="page" href="#" id="logoutBtn"
                                onclick="logout()">Logout</a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>
        <div class="container  text-center ">



            <div class="user-info p-5 w-75     login d-none home" id="home">
                <div class="login-content main-color  d-flex flex-column justify-content-center align-items-center">
                    <h2 id="userName">Welcome </h2>
                </div>
            </div>


            <div class="login p-5 w-75  m-auto" id="login">
                <div class="login-content main-color  d-flex flex-column justify-content-center align-items-center">
                    <h2>Smart Login System</h2>
                    <input type="text" name="name" id="name" class="form-control my-3 text-white d-none"
                        placeholder="Enter your name">
                    <input type="email" name="email" id="email" class="form-control my-3 text-white"
                        placeholder="Enter your email">
                    <input type="password" name="password" id="password" class="form-control my-3 text-white"
                        placeholder="Enter your password">
                    <p class="incorrect text-danger  d-none"><span class="text-danger m-3">All inputs is required</span>
                    </p>
                    <button onclick="login()" class="btn btn-outline-info w-100 my-3" id="btnLogin">Login</button>
                    <p class="text-white">
                        Don’t have an account?
                        <a class="text-white " onclick="sign()" href="#" id="signIn">Sign Up</a>
                    </p>
                </div>

            </div>

        </div>




        </div>
    </main>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
